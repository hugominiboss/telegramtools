<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Amelia Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-indigo-400">Amelia <span class="text-white">Control Panel</span></h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass p-6 rounded-2xl">
                <p class="text-slate-400 text-sm">Status</p>
                <p id="status-val" class="text-xl font-bold">Carregando...</p>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-slate-400 text-sm">Total Enviados</p>
                <p id="count-val" class="text-xl font-bold">0</p>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-slate-400 text-sm">Último Grupo</p>
                <p id="group-val" class="text-xs font-mono truncate">Nenhum</p>
            </div>
        </div>
        <div class="glass p-8 rounded-3xl flex flex-col gap-4">
            <button onclick="sendAction('start')" class="bg-indigo-600 p-4 rounded-xl font-bold hover:bg-indigo-500 transition">Iniciar Automação</button>
            <button onclick="sendAction('stop')" class="bg-slate-700 p-4 rounded-xl font-bold hover:bg-slate-600 transition">Pausar Sistema</button>
            <button onclick="sendAction('force')" class="bg-orange-600 p-4 rounded-xl font-bold hover:bg-orange-500 transition">DISPARO MASSIVO AGORA</button>
        </div>
    </div>
    <script>
        async function update() {
            try {
                const res = await fetch('/api/stats');
                ```javascript
const data = await res.json();
document.getElementById('status-val').innerText = data.status;
document.getElementById('count-val').innerText = data.total_sent;
document.getElementById('group-val').innerText = data.last_group;
} catch (e) { console.error("Erro ao atualizar stats"); }
}
async function sendAction(cmd) {
await fetch('/api/action', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({command: cmd})
});
update();
}
setInterval(update, 2000);
update();
</script>
</body>
</html>
