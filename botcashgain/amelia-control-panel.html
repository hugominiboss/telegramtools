<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amelia Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">Amelia <span class="text-indigo-400">Control Panel</span></h1>
                <p class="text-slate-400">Gerenciamento Centralizado de Userbots</p>
            </div>
            <div id="connection-status" class="flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/10 text-green-400 text-sm border border-green-500/20">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> Sistema Online
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Stats Cards -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="p-3 rounded-lg bg-indigo-500/20 text-indigo-400"><i data-lucide="activity"></i></div>
                        <span class="text-slate-400 font-medium">Status do Bot</span>
                    </div>
                    <div id="status-val" class="text-2xl font-bold">Carregando...</div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="p-3 rounded-lg bg-purple-500/20 text-purple-400"><i data-lucide="send"></i></div>
                        <span class="text-slate-400 font-medium">Total Enviados</span>
                    </div>
                    <div id="count-val" class="text-2xl font-bold">0</div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="p-3 rounded-lg bg-blue-500/20 text-blue-400"><i data-lucide="users"></i></div>
                        <span class="text-slate-400 font-medium">Último Grupo</span>
                    </div>
                    <div id="group-val" class="text-sm font-mono break-all text-slate-300">Nenhum</div>
                </div>
            </div>

            <!-- Control Center -->
            <div class="lg:col-span-2 glass p-8 rounded-3xl">
                <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                    <i data-lucide="cpu" class="text-indigo-400"></i> Central de Comando
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="sendAction('start')" class="btn-primary p-4 rounded-xl font-bold flex items-center justify-center gap-2">
                        <i data-lucide="play"></i> Iniciar Automação
                    </button>
                    <button onclick="sendAction('stop')" class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="pause"></i> Pausar Sistema
                    </button>
                    <button onclick="sendAction('force')" class="bg-orange-600 hover:bg-orange-500 p-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all col-span-1 md:col-span-2">
                        <i data-lucide="zap"></i> DISPARO MASSIVO AGORA
                    </button>
                </div>

                <div class="mt-10 pt-10 border-t border-white/10">
                    <h3 class="text-slate-400 text-sm font-medium mb-4 uppercase tracking-wider">Módulos Integrados</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="p-3 rounded-lg bg-white/5 border border-white/10 flex items-center gap-3 opacity-50 cursor-not-allowed">
                            <i data-lucide="message-square" class="w-4 h-4"></i> <span class="text-xs">Captura de Leads</span>
                        </div>
                        <div class="p-3 rounded-lg bg-white/5 border border-white/10 flex items-center gap-3 opacity-50 cursor-not-allowed">
                            <i data-lucide="shield" class="w-4 h-4"></i> <span class="text-xs">Anti-Ban Filter</span>
                        </div>
                        <div class="p-3 rounded-lg bg-white/5 border border-white/10 flex items-center gap-3 opacity-50 cursor-not-allowed">
                            <i data-lucide="database" class="w-4 h-4"></i> <span class="text-xs">Gestor de Grupos</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function updateStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('status-val').innerText = data.status;
                document.getElementById('count-val').innerText = data.total_sent;
                document.getElementById('group-val').innerText = data.last_group;
            } catch (e) { console.error("Erro ao atualizar stats"); }
        }

        async function sendAction(cmd) {
            await fetch('/api/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: cmd})
            });
            updateStats();
        }

        setInterval(updateStats, 2000);
        updateStats();
    </script>
</body>
</html>
